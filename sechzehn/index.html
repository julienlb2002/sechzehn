<script>
  // Hell/Dunkel vor dem ersten Zeichnen festlegen, damit beim Laden nichts aufblitzt. Ohne eigene Wahl gilt die Systemeinstellung.
  // Im Entwicklermodus (nur lokal) erzwingt ?theme=light|dark den Modus, ohne ihn zu speichern (für Screenshots).
  (function () {
    var t = null, q = location.search, local = /^(localhost|127\.0\.0\.1|\[::1\]|)$/.test(location.hostname);
    try { t = localStorage.getItem('sechzehn-theme'); } catch (e) { }
    var m = local && /[?&]dev=1(&|$)/.test(q) && q.match(/[?&]theme=(light|dark)(&|$)/);
    if (m) t = m[1];
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">

      <button class="iconbtn diabtn" id="diabtn" type="button" aria-haspopup="dialog" hidden><span></span></button>
    </div>
    <h1>Sechzehn</h1>
    <div class="tools right">
      <button class="iconbtn" id="help" type="button" aria-label="Spielregeln">?</button>
      <button class="iconbtn" id="soundbtn" type="button" aria-label="Ton aus">
        <svg class="on" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6h2.6L8 3v10L4.6 10H2z"/><path d="M10.5 5.6a3.2 3.2 0 0 1 0 4.8M12.3 3.8a5.8 5.8 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="off" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6h2.6L8 3v10L4.6 10H2z"/><path d="M10.5 6l3.5 4M14 6l-3.5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="iconbtn" id="themebtn" type="button" aria-label="Zum dunklen Modus wechseln">
        <svg class="sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></g></svg>
        <svg class="moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.6 10.2A6 6 0 0 1 5.8 2.4a6 6 0 1 0 7.8 7.8z"/></svg>
      </button>
    </div>
  </div>
  <div id="sheet" hidden></div>
